name: CI

# Offline unit-test + lint CI. Runs the full Pester suite (tests/) and
# PSScriptAnalyzer against the module source on every push/PR to main. No
# Azure login, no secrets — live tenant runs are handled by
# azure-inventory.yml (workflow_dispatch, service-principal auth).
#
# Runs on windows-latest for parity with the machines this module actually ships to; the
# Excel report customization step no longer depends on a COM object (AB#5662/AB#5665
# retired src/report/renderers/inventory/style/Build-AZSCExcelChartStyle.ps1's COM
# predecessor in favour of EPPlus-native chart/shape styling), so this job could run
# cross-platform if that ever becomes worth doing.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Write-Host 'Installing Pester 5.x...'
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Write-Host 'Installing PSScriptAnalyzer...'
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Write-Host 'Installing ImportExcel (Excel report tests exercise this dependency)...'
          Install-Module ImportExcel -Force -Scope CurrentUser
          # powershell-yaml is a hard #requires on six test files -- every one that loads a
          # rule file through Get-RuleSet. Without it Pester fails at DISCOVERY, not at run
          # time, so the affected files reported as errored rather than failed and the real
          # cause ("the module cannot be found") was buried under a stack trace. It was never
          # installed here, so those six have never actually run in CI.
          Write-Host 'Installing powershell-yaml (the rule engine parses YAML rule files)...'
          Install-Module powershell-yaml -Force -Scope CurrentUser

      - name: Validate declarative collector definitions
        shell: pwsh
        run: |
          # AB#5661. Fails the build if any .psd1 under manifests/collectors is malformed, names an
          # Export column no Field produces, declares a SetupVariable its SetupPreamble never
          # assigns, or has DRIFTED from the collector it was generated from.
          #
          # BEFORE the Pester step, deliberately: these are structural faults that make the
          # equivalence suite either fail confusingly or -- worse -- pass while the report ships a
          # blank column. Failing here names the .psd1 and the reason on the file in the PR diff.
          # tests/CollectorDefinitionSchema.Tests.ps1 runs the same script so the gate fires locally.
          ./scripts/Test-ScoutCollectorDefinition.ps1

      - name: Run Pester test suite
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force

          $resultsDir = Join-Path $env:GITHUB_WORKSPACE 'test-results'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          $resultsPath = Join-Path $resultsDir 'pester-results.xml'

          $config = New-PesterConfiguration
          $config.Run.Path = './tests/'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = $resultsPath

          $result = Invoke-Pester -Configuration $config

          Write-Host "Pester: Total=$($result.TotalCount) Passed=$($result.PassedCount) Failed=$($result.FailedCount) Skipped=$($result.SkippedCount)"

          if ($result.FailedCount -gt 0) {
            Write-Host "::error::$($result.FailedCount) Pester test(s) failed."
            exit 1
          }

      - name: Upload Pester test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-test-results
          path: test-results/pester-results.xml
          if-no-files-found: warn

      - name: Guard against reintroduced StrictMode weakening
        shell: pwsh
        run: |
          # AB#5672. Fails the build if any Set-StrictMode call in Modules/, src/ or scripts/ is
          # something other than -Version Latest and is not on the annotated allow-list inside the
          # script. The allow-list holds the twenty sites that already existed, each with a reason,
          # and the guard also fails when an entry goes stale -- so the number can only go down.
          #
          # Its own step rather than relying on tests/StrictModeGuard.Tests.ps1 alone, so a violation
          # is annotated on the offending file and line in the PR diff instead of being buried in a
          # Pester summary. Both call the same scanner; the Pester copy is what makes the check fire
          # locally as well.
          ./scripts/Test-StrictModeGuard.ps1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -Force

          $paths = @('src', 'Modules') | Where-Object { Test-Path $_ }
          $findings = foreach ($p in $paths) {
            Invoke-ScriptAnalyzer -Path $p -Recurse -Severity Error, Warning
          }

          $errors   = @($findings | Where-Object { $_.Severity -eq 'Error' })
          $warnings = @($findings | Where-Object { $_.Severity -eq 'Warning' })

          foreach ($w in $warnings) {
            Write-Host "::warning file=$($w.ScriptPath),line=$($w.Line)::[$($w.RuleName)] $($w.Message)"
          }
          foreach ($e in $errors) {
            Write-Host "::error file=$($e.ScriptPath),line=$($e.Line)::[$($e.RuleName)] $($e.Message)"
          }

          Write-Host "PSScriptAnalyzer: $($errors.Count) error(s), $($warnings.Count) warning(s) (warnings are non-blocking)."

          if ($errors.Count -gt 0) {
            Write-Host "::error::PSScriptAnalyzer found $($errors.Count) Error-severity finding(s)."
            exit 1
          }
